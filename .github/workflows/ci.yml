name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs run the same targets a developer runs locally: `make check-backend` and
# `make check-frontend`. The Makefile is the single definition of "passing".
jobs:
  backend:
    name: Backend (format + lint + types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Check
        run: make check-backend

  frontend:
    name: Frontend (format + lint + types + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Check
        run: make check-frontend
