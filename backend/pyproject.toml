[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-coach-backend"
version = "0.0.0"
description = "Local NLHE training app — backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "sqlmodel>=0.0.22",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.14",
  "pre-commit>=4",
]
# Analytics export (tools/export_analytics.py) — Parquet writer only.
export = [
  "pyarrow>=18",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the backend root on sys.path so `tests.<module>` imports resolve under a
# bare `pytest` (CI), not just `python -m pytest` (which injects the CWD).
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

# Modules whose remaining errors are neither of the two patterns fixed in this
# slice. Baselined per module (never per line, never globally) so the count is
# visible and a later slice can delete a block outright.

[[tool.mypy.overrides]]
# BASELINE(2026-09-18): 33 errors, SQLAlchemy column expressions and Optional
# session columns read as their Python values.
module = "app.services.sim_session"
ignore_errors = true

[[tool.mypy.overrides]]
# BASELINE(2026-09-18): 17 errors, Optional street and lever values propagated
# through the merit arithmetic.
module = "app.domain.personas_postflop"
ignore_errors = true

[[tool.mypy.overrides]]
# BASELINE(2026-09-18): 12 errors, `Position | None` propagated into the
# scenario predicates.
module = "app.domain.scenarios"
ignore_errors = true

[[tool.mypy.overrides]]
# BASELINE(2026-09-18): 4 errors, SQLAlchemy column expressions typed as the
# Python values they map to.
module = "app.services.stats"
ignore_errors = true

[[tool.mypy.overrides]]
# BASELINE(2026-09-18): 3 errors, heterogeneous tuple rebinding and a
# variable-length hole-card tuple.
module = "app.api.v1.drill"
ignore_errors = true

[[tool.mypy.overrides]]
# BASELINE(2026-09-18): 2 errors, `VillainType | None` propagated into the
# adjustment lookup.
module = "app.domain.feedback"
ignore_errors = true

[[tool.mypy.overrides]]
# BASELINE(2026-09-18): 2 errors, an overloaded function passed as the
# `sorted`/`max` key.
module = "app.domain.challenge"
ignore_errors = true

[[tool.mypy.overrides]]
# BASELINE(2026-09-18): 1 error, SQLAlchemy `order_by` on a mapped date column.
module = "app.services.review"
ignore_errors = true

[[tool.mypy.overrides]]
# BASELINE(2026-09-18): 1 error, `int | None` seat index used to index the seat
# list.
module = "app.domain.table.engine"
ignore_errors = true

[[tool.mypy.overrides]]
# BASELINE(2026-09-18): 1 error, `tuple | None` returned where the signature
# declares a tuple.
module = "app.domain.equity"
ignore_errors = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

